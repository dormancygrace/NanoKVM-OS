name: Add-on release

# Builds independent add-ons and stages validated candidates for Pages.
# Lightweight version tags reserve revisions; no add-on Releases are created.
# PRs and dry runs build only.
on:
  workflow_dispatch:
    inputs:
      addon:
        description: 'Add-on, or all five model add-ons'
        default: nanokvm-ipmi
        type: choice
        options: [nanokvm-ipmi, nanokvm-model-ocr, nanokvm-model-ocr-latin, nanokvm-model-ocr-cyrillic,
                  nanokvm-model-ocr-chinese, nanokvm-model-screen, models]
      dry_run:
        description: 'Build and check only; publish nothing'
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/addon.yml
      - scripts/pages_store.py
      - scripts/build-addon.py
      - scripts/addon_packages.py
      - scripts/next-addon-revision.py
      - addons/ipmi/**
      - addons/model-*/**
      - tpu/models/**
      - tpu/helpers/cvimodel-dmabuf.c
      - platform/sources.lock
      - tests/test-addon-packages.py
      - tests/test-build-addon.py
      - tests/test-next-addon-revision.py
      - LICENSE
      - firmware/cpu/sysmon-runtime/**
      - server/pkg/bmc/**
      - server/go.mod
      - server/go.sum

permissions:
  contents: read

concurrency:
  group: addon-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select add-ons
    runs-on: ubuntu-26.04
    outputs:
      addons: ${{ steps.select.outputs.addons }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected recipes
        id: select
        env:
          REQUESTED: ${{ inputs.addon }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, 'scripts')
          import addon_packages as registry
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              requested = os.environ['REQUESTED']
              if requested == 'models':
                  addons = list(registry.MODEL_ADDONS)
              elif requested in registry.BUILD_ADDONS:
                  addons = [requested]
              else:
                  raise SystemExit('Unknown add-on: ' + requested)
          else:
              refs = [os.environ['BASE'] + '...' + os.environ['HEAD']]
              paths = subprocess.check_output(['git', 'diff', '--name-only', *refs], text=True).splitlines()
              diff = subprocess.check_output(['git', 'diff', '--unified=0', *refs, '--', 'platform/sources.lock'], text=True)
              pins = {line[1:].split()[0] for line in diff.splitlines()
                      if line.startswith(('+', '-')) and not line.startswith(('+++', '---'))
                      and line[1:].strip() and not line[1:].lstrip().startswith('#')}
              addons = registry.selected_builds(paths, pins)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('addons=' + json.dumps(addons) + '\n')
          print('Selected: ' + ', '.join(addons))
          PY

  build:
    name: Build and check (${{ matrix.addon }})
    needs: plan
    if: needs.plan.outputs.addons != '[]'
    runs-on: ubuntu-26.04
    # A model conversion takes most of it.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.plan.outputs.addons) }}
    env:
      ADDON: ${{ matrix.addon }}
    steps:
      # A dry run may build any branch: a model add-on is checked so before
      # it merges.
      - name: Validate the branch
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo 'Run the add-on release from main' >&2; exit 1; }

      - uses: actions/checkout@v7

      - name: Kind
        id: kind
        run: |
          set -euo pipefail
          parts=$(python3 scripts/build-addon.py --addon "$ADDON" --parts-only)
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          echo "convert.sh parts: ${parts:-none (a program)}"

      # The converter image takes about 10 GB unpacked.
      - name: Free disk space
        if: steps.kind.outputs.parts != ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Cache converter downloads
        if: steps.kind.outputs.parts != ''
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tpu-pip
          key: tpu-pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tpu/models/convert.sh') }}

      - name: Convert models
        if: steps.kind.outputs.parts != ''
        env:
          PARTS: ${{ steps.kind.outputs.parts }}
          NANOKVM_TPU_PIP_CACHE: ${{ runner.temp }}/tpu-pip
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # one argument per part
          tpu/models/convert.sh "$RUNNER_TEMP/models" $PARTS
          tpu/models/stage.sh "$RUNNER_TEMP/models" "$RUNNER_TEMP/staged"
          (cd "$RUNNER_TEMP/staged" && find . -type f | sort | xargs sha256sum)

      # The OS build's Go: the pinned official toolchain (platform/sources.lock)
      # with the NanoKVM runtime (firmware/cpu/sysmon-runtime).
      - name: Go
        if: steps.kind.outputs.parts == ''
        run: |
          set -euo pipefail
          read -r _ url sum < <(awk '$1 == "go" { print $1, $2, $3 }' platform/sources.lock)
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/go.tar.gz" "$url"
          echo "$sum  $RUNNER_TEMP/go.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/go-base"
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP/go-base"
          python3 firmware/cpu/sysmon-runtime/prepare.py --base "$RUNNER_TEMP/go-base/go" --output "$RUNNER_TEMP/goroot" > /dev/null
          "$RUNNER_TEMP/goroot/bin/go" version

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 scripts/build-addon.py --addon "$ADDON" --version-only)
          # The request must succeed: a failure inside $(...) would count no
          # tags and reuse a revision.
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' > "$RUNNER_TEMP/tags"
          revision=$(python3 scripts/next-addon-revision.py "$ADDON" "$version" < "$RUNNER_TEMP/tags")
          tag=$ADDON-$version-r$revision
          {
            echo "revision=$revision"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "$tag"

      # apk mkpkg records the owner of every payload file, which must be
      # root:root. The builder runs under fakeroot, and apk runs in an Alpine
      # container as real root (fakeroot cannot reach the container): it gives
      # the payload to root for mkpkg and back to the runner afterwards.
      - name: Host apk
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot
          cat > "$RUNNER_TEMP/apk" <<'EOF'
          #!/bin/sh
          files=
          output=
          prev=
          for arg; do
            [ "$prev" = --files ] && files=$arg
            [ "$prev" = --output ] && output=$arg
            prev=$arg
          done
          exec docker run --rm -v "$HOME:$HOME" -v "$RUNNER_TEMP:$RUNNER_TEMP" -v /tmp:/tmp -w "$PWD" \
            -e FILES="$files" -e OUTPUT="$output" -e OWNER="$HOST_OWNER" alpine:3.24 sh -euc '
              [ -z "$FILES" ] || chown -R 0:0 "$FILES"
              status=0; apk "$@" || status=$?
              [ -z "$FILES" ] || chown -R "$OWNER" "$FILES"
              [ ! -e "$OUTPUT" ] || chown "$OWNER" "$OUTPUT"
              exit $status' apk "$@"
          EOF
          chmod 0755 "$RUNNER_TEMP/apk"
          echo "HOST_OWNER=$(id -u):$(id -g)" >> "$GITHUB_ENV"

      - name: Build
        env:
          REVISION: ${{ steps.version.outputs.revision }}
          TAG: ${{ steps.version.outputs.tag }}
          GOFLAGS: -mod=readonly
          PARTS: ${{ steps.kind.outputs.parts }}
        run: |
          set -euo pipefail
          if [ -n "$PARTS" ]; then
            input=(--models "$RUNNER_TEMP/staged/usr/lib/nanokvm-tpu/models")
          else
            input=(--go "$RUNNER_TEMP/goroot/bin/go")
          fi
          fakeroot python3 scripts/build-addon.py --addon "$ADDON" "${input[@]}" \
            --apk "$RUNNER_TEMP/apk" --output "$RUNNER_TEMP/addon" --revision "$REVISION" \
            --commit "$GITHUB_SHA" --source-url "https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
          (cd "$RUNNER_TEMP/addon" && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" .)
          ls -la "$RUNNER_TEMP/addon"
          cat "$RUNNER_TEMP/addon/SHA256SUMS"

      # What devices get: the version, a static riscv64 program or the models
      # with their checksums, the files and scripts of the recipe, and the
      # source record.
      - name: Check the package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          a=$RUNNER_TEMP/addon
          docker run --rm -v "$a:$a" -v "$PWD:/src:ro" -e TAG -e ADDON -e GITHUB_SHA alpine:3.24 sh -euc '
            apk add --no-cache file python3 > /dev/null
            apk=$1/$TAG.apk
            apk adbdump "$apk" | grep -qx "  version: ${TAG#"$ADDON"-}"
            d=$(mktemp -d)
            apk extract --allow-untrusted --destination "$d" "$apk"
            python3 - "$d" /src/addons/${ADDON#nanokvm-}/addon.json "$apk" <<"PY"
          import json, os, subprocess, sys
          root, recipe = sys.argv[1], json.load(open(sys.argv[2]))
          # The minimum OS release is a dependency of the package.
          dump = subprocess.check_output(["apk", "adbdump", sys.argv[3]], text=True)
          assert "nanokvm-os>=" + recipe["os"] in dump.split(), recipe["os"]
          record = json.load(open(root + "/usr/share/" + recipe["name"] + "/source.json"))
          assert record["commit"] == os.environ["GITHUB_SHA"], record
          if "go" in recipe:
              program = root + recipe["go"]["path"]
              out = subprocess.check_output(["file", program], text=True)
              assert "RISC-V" in out and "statically linked" in out, out
          else:
              import hashlib
              assert "nanokvm-tpu-abi=1" in dump.split(), "no TPU ABI dependency"
              assert sorted(record["models"]) == sorted(recipe["models"]), record["models"]
              for path in recipe["models"]:
                  model = root + "/usr/lib/nanokvm-tpu/models/" + path
                  assert os.stat(model).st_mode & 0o777 == 0o644, path
                  assert hashlib.sha256(open(model, "rb").read()).hexdigest() == record["models"][path], path
          for path, item in recipe["files"].items():
              assert os.stat(root + path).st_mode & 0o777 == int(item["mode"], 8), path
          PY
            echo "package checked"' sh "$a"

      - uses: actions/upload-artifact@v7
        with:
          name: addon-${{ matrix.addon }}
          path: ${{ runner.temp }}/addon
          retention-days: 14

  publish:
    name: Stage for Pages (${{ matrix.addon }})
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
    needs: [plan, build]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.plan.outputs.addons) }}
    env:
      ADDON: ${{ matrix.addon }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: addon-${{ matrix.addon }}
          path: ${{ runner.temp }}/addon

      - name: Validate the release files
        run: |
          python3 - <<'PY'
          import hashlib, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import addon_packages as registry
          root = Path(os.environ['RUNNER_TEMP']) / 'addon'
          packages = list(root.glob('*.apk'))
          if len(packages) != 1 or registry.addon(packages[0].name) != os.environ['ADDON']:
              raise SystemExit('Expected one APK for ' + os.environ['ADDON'])
          package = packages[0]
          if {p.name for p in root.iterdir()} != {package.name, 'SHA256SUMS'}:
              raise SystemExit('Unexpected release files')
          if any(p.is_symlink() or not p.is_file() for p in root.iterdir()):
              raise SystemExit('Release artifacts must be regular files')
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          if (root / 'SHA256SUMS').read_text() != f'{digest}  {package.name}\n':
              raise SystemExit('APK checksum mismatch')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TAG=' + package.stem + '\n')
          PY

      - name: Reserve version and stage Pages candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # create-ref fails on an existing tag: never replace a package version.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          python3 scripts/pages_store.py --stage "$RUNNER_TEMP/addon" --kind addon --tag "$TAG"

      - uses: actions/upload-artifact@v7
        with:
          name: pages-candidate-${{ matrix.addon }}
          path: ${{ runner.temp }}/addon
          retention-days: 90
