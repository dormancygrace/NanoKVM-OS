name: Release

# Releases NanoKVM OS. Run it by hand ("Run workflow"): a patch release
# (v3.4.1) or a minor one (v3.5.0) from main, or a patch release from a
# release/X.Y branch. The version follows the newest release
# (scripts/next-release.py). A pushed vX.Y.Z tag also releases, with the
# versions of firmware/alpine/release.env.
#
# The build job has no secrets. The sign job runs in the protected `release`
# environment, so the signing keys are used only after a maintainer approves
# the run. It signs the packages that changed and both indexes, and attaches
# them to immutable os-packages-v* technical releases. Public OS releases
# contain corresponding source, checksums and the SD image only when asked.
# A patch release is published at once, which publishes its packages (apk-repository.yml); a minor release and a pushed tag
# stay drafts for their notes.
#
# Pull requests that change the release process, and dry runs, build the same
# with local test keys and keep the assets as an artifact; nothing is published.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'stable: production releases; beta: opt-in prereleases'
        type: choice
        options: [stable, beta]
        default: stable
      kind:
        description: 'patch: fixes (v3.4.1); minor: a new feature release (v3.5.0)'
        type: choice
        options: [patch, minor]
        default: patch
      image:
        description: 'Publish a new SD image (first-boot, layout or install changes)'
        type: boolean
        default: false
      stock_installer:
        description: 'Include experimental stock migration package (requires stock-device qualification)'
        type: boolean
        default: false
      dry_run:
        description: 'Test keys; publish nothing'
        type: boolean
        default: false
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/**
      - scripts/next-release.py
      - scripts/publish-release.sh
      - scripts/publish-release.py
      - scripts/release_assets.py
      - scripts/release_build_tar.py
      - scripts/sign-release.sh
      - scripts/apk_resign.py
      - scripts/check-release-key.sh
      - scripts/alpine-signer.sh
      - tests/test-apk-resign.py
      - tests/test-release-build-tar.py
      - tests/test-release-storage.py
      - tests/test-release-workflow.py
      - scripts/build-stock-installer.py
      - scripts/install-stock.py
      - firmware/stock-install/**
      - tests/test-stock-installer.py
      - tests/test-stock-layout-loop.py

permissions:
  contents: read

# One release at a time; a second run waits instead of picking the same version.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A fixed absolute path: the cached toolchain is not relocatable.
  OUT: /home/runner/nanokvm-out
  # The published repository: a package whose content is unchanged keeps its
  # version and file from there (scripts/package-versions.py).
  NANOKVM_PREVIOUS: https://dormancygrace.github.io/NanoKVM-OS/alpine/v3.24/riscv64
  # The release keys, under their names in firmware/alpine/keys.
  EC_KEY_NAME: nkos-release-ec-b8e89b66

jobs:
  build:
    name: Build
    # Ubuntu 26.04: the kernel configuration depends on the host OpenSSL.
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      apk_version: ${{ steps.version.outputs.apk_version }}
      image_version: ${{ steps.version.outputs.image_version }}
      image: ${{ steps.version.outputs.image }}
      draft: ${{ steps.version.outputs.draft }}
      publish: ${{ steps.version.outputs.publish }}
      previous: ${{ steps.version.outputs.previous }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      # Use GitHub's branch selector, never a second caller-controlled checkout.
      # Reject other refs before sourcing or executing anything from the tree.
      - name: Validate release branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" =~ ^refs/heads/release/[0-9]+\.[0-9]+$ ]] || {
            echo 'Select main or release/X.Y in Use workflow from' >&2
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          KIND: ${{ inputs.kind }}
          CHANNEL: ${{ inputs.channel }}
          REF: ${{ github.ref_name }}
          IMAGE: ${{ inputs.image }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          . firmware/alpine/release.env
          channel=${CHANNEL:-stable}
          if [ "$EVENT" != workflow_dispatch ]; then
            case $NANOKVM_VERSION in *-beta.*) channel=beta ;; esac
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          case $EVENT in
            workflow_dispatch)
              image=()
              [ "$IMAGE" != true ] || image=(--image)
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' > "$RUNNER_TEMP/release-list"
              jq -s . "$RUNNER_TEMP/release-list" |
                python3 scripts/next-release.py --channel "${CHANNEL:-stable}" --kind "$KIND" --ref "$REF" "${image[@]}" > "$RUNNER_TEMP/next"
              cat "$RUNNER_TEMP/next" >> "$GITHUB_OUTPUT"
              echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
              [ "$KIND" = minor ] && echo draft=true >> "$GITHUB_OUTPUT" || echo draft=false >> "$GITHUB_OUTPUT"
              [ "$DRY_RUN" = true ] && echo publish=false >> "$GITHUB_OUTPUT" || echo publish=true >> "$GITHUB_OUTPUT"
              cat "$RUNNER_TEMP/next" ;;
            push)
              # Publishing a draft creates its tag, which lands here: that release exists.
              if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
                echo "Release $GITHUB_REF_NAME exists; nothing to do"
                printf 'skip=true\npublish=false\n' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$GITHUB_REF_NAME" != "$NANOKVM_VERSION" ]; then
                echo "Tag $GITHUB_REF_NAME, but firmware/alpine/release.env says $NANOKVM_VERSION" >&2
                exit 1
              fi
              printf 'version=%s\napk_version=%s\nimage_version=%s\nimage=true\ndraft=true\npublish=true\n' \
                "$NANOKVM_VERSION" "$NANOKVM_APK_VERSION" "$NANOKVM_IMAGE_VERSION" >> "$GITHUB_OUTPUT" ;;
            *)
              # release.env is an image baseline and can lag published packages.
              # Exercise reuse with a prospective release, as dispatch does.
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' > "$RUNNER_TEMP/release-list"
              jq -s . "$RUNNER_TEMP/release-list" |
                python3 scripts/next-release.py --channel "$channel" --kind patch --ref main --image > "$RUNNER_TEMP/next"
              cat "$RUNNER_TEMP/next" >> "$GITHUB_OUTPUT"
              printf 'image=true\ndraft=true\npublish=false\n' >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: ./.github/actions/prepare-build
        id: prepare
        if: steps.version.outputs.skip != 'true'
        with:
          out: ${{ env.OUT }}

      - name: Build
        if: steps.version.outputs.skip != 'true'
        env:
          NANOKVM_PATCH_GIT: '0'
          NANOKVM_VERSION: ${{ steps.version.outputs.version }}
          NANOKVM_APK_VERSION: ${{ steps.version.outputs.apk_version }}
          NANOKVM_IMAGE_VERSION: ${{ steps.version.outputs.image_version }}
        run: |
          platform/build.sh -o "$OUT" kernel modules uboot opensbi fip initramfs boot native system tools server
          # The Go build cache (about 1 GB) is not reused within a run.
          rm -rf "$OUT/server/gocache"
          platform/build.sh -o "$OUT" web firmware hashes source

      # The packages, root file system and SD image (always built, as a check
      # that the packages install), signed with a throwaway key: this job runs
      # third-party build code and never holds the release key. The sign job
      # gives the repository the release signature (scripts/sign-release.sh).
      # These steps run as root of a user namespace with subordinate IDs
      # (platform/README.md). Ubuntu lets AppArmor deny unprivileged user
      # namespaces by default.
      - name: User namespaces
        if: steps.version.outputs.skip != 'true'
        run: |
          user=$(id -un)
          for file in /etc/subuid /etc/subgid; do
            grep -q "^$user:" "$file" 2>/dev/null || echo "$user:100000:65536" | sudo tee -a "$file"
          done
          ! sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1 ||
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Packages, root file system and image
        if: steps.version.outputs.skip != 'true'
        env:
          BUILD_STOCK_INSTALLER: ${{ inputs.stock_installer == true || github.event_name == 'pull_request' }}
          NANOKVM_CHANNEL: ${{ steps.version.outputs.channel }}
          # Compare with the newest tested set, including betas; package-versions.py
          # rebuilds every prerelease package when producing a stable release.
          NANOKVM_PREVIOUS: https://dormancygrace.github.io/NanoKVM-OS/beta/alpine/v3.24/riscv64
          NANOKVM_VERSION: ${{ steps.version.outputs.version }}
          NANOKVM_APK_VERSION: ${{ steps.version.outputs.apk_version }}
          NANOKVM_IMAGE_VERSION: ${{ steps.version.outputs.image_version }}
        run: |
          platform/build.sh -o "$OUT" -u payloads packages rootfs image
          extra=()
          if [ "${BUILD_STOCK_INSTALLER:-false}" = true ]; then
            platform/build.sh -o "$OUT" stock-installer
            extra=(release/stock-installer)
          fi
          # A tar keeps the file modes, which an artifact drops. Transfer only
          # the finished image: image/root contains private runtime files owned
          # by subordinate IDs, and the other image files are build intermediates.
          (cd "$OUT" && tar -cf "$RUNNER_TEMP/release-build.tar" release/apk \
            release/image/*.img.zip release/image/build-manifest.json \
            release/installed-packages.txt release/installed-licenses.txt "NanoKVM-OS-$NANOKVM_VERSION-source.tar.xz" "${extra[@]}")

      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.skip != 'true'
        with:
          name: release-build
          path: ${{ runner.temp }}/release-build.tar
          retention-days: 7

      - name: Save compiler cache
        uses: ./.github/actions/save-compiler-cache
        if: always() && steps.prepare.outputs.ccache-key != ''
        with:
          out: ${{ env.OUT }}
          key: ${{ steps.prepare.outputs.ccache-key }}

  sign:
    name: Sign and release
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
      # Starts apk-repository.yml: a release created with this token
      # triggers no workflow by itself.
      actions: write
    env:
      NANOKVM_CHANNEL: ${{ needs.build.outputs.channel }}
      NANOKVM_VERSION: ${{ needs.build.outputs.version }}
      NANOKVM_APK_VERSION: ${{ needs.build.outputs.apk_version }}
      NANOKVM_IMAGE_VERSION: ${{ needs.build.outputs.image_version }}
    steps:
      # The job holds the signing key and a write token: keep the token out
      # of .git/config, where the build tools it runs could read it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Each private key next to its public key from firmware/alpine/keys, as
      # platform/build.sh pairs them; it refuses keys that are not there.
      - name: Signing keys
        env:
          EC_KEY: ${{ secrets.APK_EC_KEY }}
        run: |
          [ -n "$EC_KEY" ] || { echo 'APK_EC_KEY is not set' >&2; exit 1; }
          k=$RUNNER_TEMP/keys
          install -d -m 0700 "$k"
          (umask 077
           printf '%s\n' "$EC_KEY" > "$k/$EC_KEY_NAME.key")
          cp "firmware/alpine/keys/$EC_KEY_NAME.pub" "$k/"

      - uses: ./.github/actions/assemble-release
        with:
          out: ${{ env.OUT }}
          keys: -e ${{ runner.temp }}/keys/${{ env.EC_KEY_NAME }}.key
          image: ${{ needs.build.outputs.image }}

      - name: Remove the keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          IMAGE: ${{ needs.build.outputs.image }}
          DRAFT: ${{ needs.build.outputs.draft }}
          PREVIOUS: ${{ needs.build.outputs.previous }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/publish-release.sh

  dry-run:
    name: Assemble with test keys
    if: needs.build.outputs.publish != 'true' && needs.build.outputs.skip != 'true'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      NANOKVM_CHANNEL: ${{ needs.build.outputs.channel }}
      NANOKVM_VERSION: ${{ needs.build.outputs.version }}
      NANOKVM_APK_VERSION: ${{ needs.build.outputs.apk_version }}
      NANOKVM_IMAGE_VERSION: ${{ needs.build.outputs.image_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/assemble-release
        with:
          out: ${{ env.OUT }}
          keys: -d
          image: ${{ needs.build.outputs.image }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-test-keys
          path: ${{ env.OUT }}/assets
          retention-days: 7
