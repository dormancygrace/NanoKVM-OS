# NanoKVM: an OpenRC service that does nothing on this board but still costs a
# service run before the server. OpenRC reads this file for each service after
# its conf.d and rc.conf; a dependency set there (rc_want, or the legacy
# RC_WANT) wins. Set those in conf.d rather than editing this
# file: apk keeps an edited copy and puts later versions beside it as .apk-new.
case $RC_SVCNAME in
procfs)
    # procfs wants modules, which then runs outside the runlevels too. Alpine's
    # /etc/modules lists af_packet and ipv6, both built into the kernel: while
    # the lists name no other module, procfs stops wanting it. The links in
    # /etc/rc.conf.d/nanokvm-module-lists point at the lists, so OpenRC, which
    # checks rc.conf.d through links, rebuilds its dependency tree when one
    # changes.
    if ! sed 's/#.*//' /etc/modules /etc/modules-load.d/*.conf /lib/modules-load.d/*.conf \
        /usr/lib/modules-load.d/*.conf /run/modules-load.d/*.conf 2>/dev/null |
        grep -qvxE '[[:space:]]*(af_packet|ipv6)?[[:space:]]*'; then
        rc_procfs_want="${rc_procfs_want-${rc_want-${RC_procfs_WANT-${RC_WANT-!modules}}}}"
    fi
    ;;
esac
