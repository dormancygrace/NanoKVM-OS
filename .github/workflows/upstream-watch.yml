name: Upstream dependency watch
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-dependency-watch
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'dormancygrace/NanoKVM-OS'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check dependency coverage and upstreams
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-upstream.py

  kernel-pr:
    if: github.repository == 'dormancygrace/NanoKVM-OS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Propose a Linux point-release update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/propose-kernel-update.py --publish
