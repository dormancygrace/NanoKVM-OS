# Root may sign in with a password: bound the guessing. Three tries per
# connection, 60 s to sign in, and each failure or unknown user holds off the
# source (an IPv4 address or an IPv6 /64) for a minute.
MaxAuthTries 3
LoginGraceTime 60
PerSourceNetBlockSize 32:64
PerSourcePenalties authfail:60s invaliduser:60s
