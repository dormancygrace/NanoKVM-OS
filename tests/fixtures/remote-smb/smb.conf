[global]
server role = standalone server
workgroup = WORKGROUP
security = user
server min protocol = SMB2_02
server max protocol = SMB3_11
server signing = mandatory
map to guest = Never
smb ports = 445
disable netbios = yes
load printers = no
printing = bsd
printcap name = /dev/null
log level = 0

[images]
path = /share
read only = yes
valid users = media

[encrypted]
path = /share
read only = yes
valid users = media
smb encrypt = required
