# MJPEG has no flow control of its own (Direct keeps 8 frames in flight, WebRTC
# is UDP): the server could fill the socket buffer (up to wmem_max, 4 MiB) with
# frames that wait in the kernel behind older ones. With 16 KiB of unsent data at most, the server
# waits instead, and the frame it then sends is current. On the stand, behind a
# 20 Mbit/s, 30 ms link, the unsent queue of an MJPEG stream fell from 167 KiB
# on average (peaks of 1 MiB, 65-400 ms) to 2 KiB, at the same frame rate and
# throughput. On 100 Mbit/s Ethernet MJPEG and a bulk download over SSH, also
# during a live stream, were as fast as before.
net.ipv4.tcp_notsent_lowat = 16384
# Keep the congestion window of a connection that paused, such as the page's
# HTTP/2 connection between requests, instead of starting slow again.
net.ipv4.tcp_slow_start_after_idle = 0
