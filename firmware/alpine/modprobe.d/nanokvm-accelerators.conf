# NanoKVM accelerator drivers: built and installed, loaded only by a user.
# udev would load them at boot by device-tree alias; until a feature uses
# them they stay out (no memory, no devices). An explicit modprobe of the
# name still loads them (docs/ACCELERATORS.md).
blacklist cv181x_ive
blacklist cv181x_tpu
blacklist cv181x_dwa
blacklist cv181x_rgn
blacklist cv181x_aximon
blacklist cv181x_trng
