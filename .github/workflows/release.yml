name: Release

# Releases NanoKVM OS. Run it by hand ("Run workflow"): a patch release
# (v3.4.1) or a minor one (v3.5.0) from main, or a patch release from a
# release/X.Y branch. The version follows the newest release
# (scripts/next-release.py). A pushed vX.Y.Z tag also releases, with the
# versions of firmware/alpine/release.env.
#
# The build job has no secrets. The sign job runs in the protected `release`
# environment, so the signing keys are used only after a maintainer approves
# the run. It signs the packages that changed and both indexes, and attaches
# them with packages.json, the source archive and SHA256SUMS to the release;
# the SD image only when asked. A patch release is published at once, which
# publishes its packages (apk-repository.yml); a minor release and a pushed tag
# stay drafts for their notes.
#
# Pull requests that change the release process, and dry runs, build the same
# with local test keys and keep the assets as an artifact; nothing is published.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'patch: fixes (v3.4.1); minor: a new feature release (v3.5.0)'
        type: choice
        options: [patch, minor]
        default: patch
      image:
        description: 'Publish a new SD image (first-boot, layout or install changes)'
        type: boolean
        default: false
      dry_run:
        description: 'Test keys; publish nothing'
        type: boolean
        default: false
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/**
      - scripts/next-release.py
      - scripts/publish-release.sh

permissions:
  contents: read

# One release at a time; a second run waits instead of picking the same version.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A fixed absolute path: the cached toolchain is not relocatable.
  OUT: /home/runner/nanokvm-out
  # The published repository: a package whose content is unchanged keeps its
  # version and file from there (scripts/package-versions.py).
  NANOKVM_PREVIOUS: https://dormancygrace.github.io/NanoKVM-OS/alpine/v3.24/riscv64
  # The release keys, under their names in firmware/alpine/keys.
  RSA_KEY_NAME: dgrace-6aaddbb6
  EC_KEY_NAME: nkos-release-ec-b8e89b66

jobs:
  build:
    name: Build
    # Ubuntu 26.04: the kernel configuration depends on the host OpenSSL.
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    outputs:
      version: ${{ steps.version.outputs.version }}
      apk_version: ${{ steps.version.outputs.apk_version }}
      image_version: ${{ steps.version.outputs.image_version }}
      image: ${{ steps.version.outputs.image }}
      draft: ${{ steps.version.outputs.draft }}
      publish: ${{ steps.version.outputs.publish }}
      previous: ${{ steps.version.outputs.previous }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      # Use GitHub's branch selector, never a second caller-controlled checkout.
      # Reject other refs before sourcing or executing anything from the tree.
      - name: Validate release branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" =~ ^refs/heads/release/[0-9]+\.[0-9]+$ ]] || {
            echo 'Select main or release/X.Y in Use workflow from' >&2
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          KIND: ${{ inputs.kind }}
          REF: ${{ github.ref_name }}
          IMAGE: ${{ inputs.image }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          . firmware/alpine/release.env
          case $EVENT in
            workflow_dispatch)
              image=()
              [ "$IMAGE" != true ] || image=(--image)
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' | jq -s . |
                python3 scripts/next-release.py --kind "$KIND" --ref "$REF" "${image[@]}" > "$RUNNER_TEMP/next"
              cat "$RUNNER_TEMP/next" >> "$GITHUB_OUTPUT"
              echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
              [ "$KIND" = minor ] && echo draft=true >> "$GITHUB_OUTPUT" || echo draft=false >> "$GITHUB_OUTPUT"
              [ "$DRY_RUN" = true ] && echo publish=false >> "$GITHUB_OUTPUT" || echo publish=true >> "$GITHUB_OUTPUT"
              cat "$RUNNER_TEMP/next" ;;
            push)
              # Publishing a draft creates its tag, which lands here: that release exists.
              if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
                echo "Release $GITHUB_REF_NAME exists; nothing to do"
                printf 'skip=true\npublish=false\n' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$GITHUB_REF_NAME" != "$NANOKVM_VERSION" ]; then
                echo "Tag $GITHUB_REF_NAME, but firmware/alpine/release.env says $NANOKVM_VERSION" >&2
                exit 1
              fi
              printf 'version=%s\napk_version=%s\nimage_version=%s\nimage=true\ndraft=true\npublish=true\n' \
                "$NANOKVM_VERSION" "$NANOKVM_APK_VERSION" "$NANOKVM_IMAGE_VERSION" >> "$GITHUB_OUTPUT" ;;
            *)
              printf 'version=%s\napk_version=%s\nimage_version=%s\nimage=true\ndraft=true\npublish=false\n' \
                "$NANOKVM_VERSION" "$NANOKVM_APK_VERSION" "$NANOKVM_IMAGE_VERSION" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: ./.github/actions/prepare-build
        if: steps.version.outputs.skip != 'true'
        with:
          out: ${{ env.OUT }}

      - name: Build
        if: steps.version.outputs.skip != 'true'
        env:
          NANOKVM_PATCH_GIT: '0'
          NANOKVM_VERSION: ${{ steps.version.outputs.version }}
          NANOKVM_APK_VERSION: ${{ steps.version.outputs.apk_version }}
          NANOKVM_IMAGE_VERSION: ${{ steps.version.outputs.image_version }}
        run: |
          platform/build.sh -o "$OUT" kernel modules uboot opensbi fip initramfs boot native system tools server
          # The Go build cache (about 1 GB) is not reused within a run.
          rm -rf "$OUT/server/gocache"
          platform/build.sh -o "$OUT" web firmware hashes source
          # A tar keeps the file modes, which an artifact drops.
          tar -C "$OUT" -cf "$RUNNER_TEMP/release-build.tar" images "NanoKVM-OS-$NANOKVM_VERSION-source.tar.xz"

      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.skip != 'true'
        with:
          name: release-build
          path: ${{ runner.temp }}/release-build.tar
          retention-days: 7

  sign:
    name: Sign and release
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
      # Starts apk-repository.yml: a release created with this token
      # triggers no workflow by itself.
      actions: write
    env:
      NANOKVM_VERSION: ${{ needs.build.outputs.version }}
      NANOKVM_APK_VERSION: ${{ needs.build.outputs.apk_version }}
      NANOKVM_IMAGE_VERSION: ${{ needs.build.outputs.image_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/prepare-build
        with:
          out: ${{ env.OUT }}

      # Each private key next to its public key from firmware/alpine/keys, as
      # platform/build.sh pairs them; it refuses keys that are not there.
      - name: Signing keys
        env:
          RSA_KEY: ${{ secrets.APK_RSA_KEY }}
          EC_KEY: ${{ secrets.APK_EC_KEY }}
        run: |
          [ -n "$RSA_KEY" ] && [ -n "$EC_KEY" ] || { echo 'APK_RSA_KEY and APK_EC_KEY are not set' >&2; exit 1; }
          k=$RUNNER_TEMP/keys
          install -d -m 0700 "$k"
          (umask 077
           printf '%s\n' "$RSA_KEY" > "$k/$RSA_KEY_NAME.rsa"
           printf '%s\n' "$EC_KEY" > "$k/$EC_KEY_NAME.key")
          cp "firmware/alpine/keys/$RSA_KEY_NAME.rsa.pub" "firmware/alpine/keys/$EC_KEY_NAME.pub" "$k/"

      - uses: ./.github/actions/assemble-release
        with:
          out: ${{ env.OUT }}
          keys: -k ${{ runner.temp }}/keys/${{ env.RSA_KEY_NAME }}.rsa -e ${{ runner.temp }}/keys/${{ env.EC_KEY_NAME }}.key
          image: ${{ needs.build.outputs.image }}

      - name: Remove the keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          IMAGE: ${{ needs.build.outputs.image }}
          DRAFT: ${{ needs.build.outputs.draft }}
          PREVIOUS: ${{ needs.build.outputs.previous }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/publish-release.sh

  dry-run:
    name: Assemble with test keys
    if: needs.build.outputs.publish != 'true' && needs.build.outputs.skip != 'true'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      NANOKVM_VERSION: ${{ needs.build.outputs.version }}
      NANOKVM_APK_VERSION: ${{ needs.build.outputs.apk_version }}
      NANOKVM_IMAGE_VERSION: ${{ needs.build.outputs.image_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/prepare-build
        with:
          out: ${{ env.OUT }}

      - uses: ./.github/actions/assemble-release
        with:
          out: ${{ env.OUT }}
          keys: -d
          image: ${{ needs.build.outputs.image }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-test-keys
          path: ${{ env.OUT }}/assets
          retention-days: 7
