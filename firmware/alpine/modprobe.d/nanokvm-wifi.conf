# The SDIO Wi-Fi drivers load from the network service (S25wifimod) in the
# background, not from udev at boot: the AIC8800 firmware upload took about
# 1.5 s of the one core while the services before the application start.
# An explicit modprobe of the name still loads them, with their
# dependencies and the Bluetooth softdep.
blacklist aic8800_bsp
blacklist aic8800_fdrv
blacklist 8733bs
