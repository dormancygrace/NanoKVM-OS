name: Upstream dependency watch
on:
  schedule:
    - cron: '23 5 * * *'
    - cron: '41 5 1 1,4,7,10 *'
  workflow_dispatch:
env:
  UPSTREAM_CADENCE: ${{ github.event_name != 'schedule' && 'all' || (github.event.schedule == '41 5 1 1,4,7,10 *' && 'quarterly' || 'daily') }}
permissions:
  contents: read
concurrency:
  group: upstream-dependency-watch
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'dormancygrace/NanoKVM-OS'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check dependency coverage and upstreams
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-upstream.py --cadence "$UPSTREAM_CADENCE"

  kernel-pr:
    if: github.repository == 'dormancygrace/NanoKVM-OS' && github.ref == 'refs/heads/main' && github.event.schedule != '41 5 1 1,4,7,10 *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Propose a Linux point-release update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/propose-kernel-update.py --publish

  dependency-prs:
    if: github.repository == 'dormancygrace/NanoKVM-OS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Propose configured upstream updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/propose-upstream-updates.py --publish --cadence "$UPSTREAM_CADENCE"
