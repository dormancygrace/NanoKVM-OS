[package]
name = "nanokvm-rustdesk"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "RustDesk protocol extension for OneKVM"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "nanokvm-rustdesk"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bytes = "1.10"
crypto_box = "0.9"
crypto_secretbox = "0.1"
ed25519-dalek = "2.1"
libc = "0.2"
prost = "0.13"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.44", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
