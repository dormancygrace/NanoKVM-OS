# fq_codel (built into the kernel) for every queue the kernel attaches from
# here on: the sysctl service runs in the boot runlevel, before the NanoKVM
# services bring Ethernet, Wi-Fi (an mq of fq_codel leaves) and USB NCM up,
# and for later devices such as tun (tailscale, OpenVPN). WireGuard keeps
# noqueue.
net.core.default_qdisc = fq_codel
