name: Assemble a release
description: >
  The packages, root file system and SD image from the outputs of a release
  build (the release-build artifact), and the release assets with their
  SHA256SUMS in OUTPUT/assets.
inputs:
  out:
    description: platform/build.sh OUTPUT, prepared by the prepare-build action
    required: true
  keys:
    description: 'platform/build.sh key options: -k KEY -e ECKEY, or -d for local test keys'
    required: true
runs:
  using: composite
  steps:
    # The packages, rootfs and image steps run as root of a user namespace
    # with subordinate IDs (platform/README.md). Ubuntu lets AppArmor deny
    # unprivileged user namespaces by default.
    - name: User namespaces
      shell: bash
      run: |
        user=$(id -un)
        for file in /etc/subuid /etc/subgid; do
          grep -q "^$user:" "$file" 2>/dev/null || echo "$user:100000:65536" | sudo tee -a "$file"
        done
        ! sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1 ||
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Download the build
      uses: actions/download-artifact@v8
      with:
        name: release-build
        path: ${{ runner.temp }}

    - name: Packages, root file system and image
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        KEYS: ${{ inputs.keys }}
      run: |
        tar -C "$OUT" -xf "$RUNNER_TEMP/release-build.tar"
        # The key options are words: -k FILE -e FILE, or -d.
        # shellcheck disable=SC2086
        platform/build.sh -o "$OUT" $KEYS payloads packages rootfs image

    - name: Assets
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        a=$OUT/assets
        rm -rf "$a"
        mkdir -p "$a"
        repo=$OUT/release/apk/recipes/riscv64
        cp "$repo"/*.apk "$repo/APKINDEX.tar.gz" "$repo/Packages.adb" "$a/"
        cp "$OUT"/release/image/*.img.zip "$OUT/release/image/build-manifest.json" \
          "$OUT/release/installed-packages.txt" "$OUT/release/installed-licenses.txt" "$a/"
        cp "$OUT"/NanoKVM-OS-*-source.tar.xz "$a/"
        (cd "$a" && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" .)
        ls -la "$a"
        cat "$a/SHA256SUMS"
