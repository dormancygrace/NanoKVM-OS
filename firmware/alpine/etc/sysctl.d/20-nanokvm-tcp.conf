# MJPEG has no flow control of its own (Direct keeps 8 frames in flight, WebRTC
# is UDP): the server could fill the socket buffer (up to wmem_max, 4 MiB) with
# frames that wait in the kernel behind older ones. A 16 KiB threshold makes
# the writer wait sooner; it is not a hard cap (an individual send can exceed
# it), and bytes already queued are not dropped. On a slow link the unsent
# queue stays small at the same frame rate; fast links lose no throughput.
net.ipv4.tcp_notsent_lowat = 16384
# Keep the congestion window of a connection that paused, such as the page's
# HTTP/2 connection between requests, instead of starting slow again.
net.ipv4.tcp_slow_start_after_idle = 0
