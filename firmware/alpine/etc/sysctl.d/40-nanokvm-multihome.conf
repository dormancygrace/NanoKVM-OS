# Ethernet and Wi-Fi can both be connected, often to the same subnet. When
# the Ethernet link goes away (cable, switch port) the device answers over
# Wi-Fi, and comes back to Ethernet with the link, without a daemon.
#
# The routes of an interface without carrier are kept, flagged linkdown; by
# default the kernel still uses them, so replies went to the dead port.
net.ipv4.conf.all.ignore_routes_with_linkdown = 1
net.ipv4.conf.default.ignore_routes_with_linkdown = 1
net.ipv6.conf.all.ignore_routes_with_linkdown = 1
net.ipv6.conf.default.ignore_routes_with_linkdown = 1
# Alpine's strict reverse-path filter (/usr/lib/sysctl.d/00-alpine.conf, which
# this file follows) dropped what came in on Wi-Fi while the route back to the
# sender was Ethernet's: the Wi-Fi address did not answer at all. Loose mode
# still drops sources that no interface routes.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
# Each interface answers ARP for its own address only and announces it, so a
# neighbour does not learn the Wi-Fi address on the Ethernet port.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
