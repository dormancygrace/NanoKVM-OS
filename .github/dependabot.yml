# Version updates complement the separately enabled security updates.
# Native source pins and locally patched forks are covered by upstream-watch.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows only; the composite actions use actions too.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: daily
      time: "06:00"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: daily
      time: "06:00"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    # Direct dependencies only: pnpm cannot pin a transitive package, so a
    # major update of one (@babel/runtime 7 -> 8) failed every run. Security
    # updates still cover transitive packages.
    allow:
      - dependency-type: direct
    # Keep Node types aligned with the Node 26 LTS build runtime and CI.
    # Revisit this together with a deliberate Node major upgrade.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      web-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      web-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /addons/rustdesk
    schedule:
      interval: daily
      time: "06:00"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    allow:
      - dependency-type: all
    groups:
      rust-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      rust-security:
        applies-to: security-updates
        patterns: ['*']

  # The compiler pin is independent of the Cargo dependency updates above.
  - package-ecosystem: rust-toolchain
    directory: /addons/rustdesk
    schedule:
      interval: daily
      time: "06:00"
    open-pull-requests-limit: 2
