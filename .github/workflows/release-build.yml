name: Release build

# Builds every pinned output of platform/build.sh on a GitHub runner and checks
# it against platform/expected.sha256. No signing keys are involved: this is
# the first step towards building and signing releases in CI. The packages,
# rootfs and image steps follow once the outputs reproduce here.
on:
  workflow_dispatch:
  # A change to this workflow proves itself with a full build.
  pull_request:
    paths:
      - .github/workflows/release-build.yml

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the pinned outputs
    # The pins come from Ubuntu 26.04 hosts: the kernel configuration depends on
    # the host OpenSSL (OPENSSL_SUPPORTS_ML_DSA needs 3.5, which 24.04 lacks).
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    env:
      # A fixed absolute path: the cached toolchain is not relocatable.
      OUT: /home/runner/nanokvm-out
    steps:
      # A toolchain build needs about 25 GB. GitHub guarantees only 14 GB, but
      # the runners had 86 GB free (2026-10-16); the cleanup, 3.5 minutes of
      # removing preinstalled SDKs and the tool cache (no setup-* action can
      # run after it), runs only when space is short.
      - name: Disk space
        run: |
          df -h /
          [ "$(df --output=avail -k / | tail -1)" -lt $((30 * 1024 * 1024)) ] || exit 0
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v7

      # Buildroot's requirements, the kernel and U-Boot host tools.
      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex cpio rsync unzip \
            file patch perl gawk wget curl git xz-utils zstd python3 python3-dev python3-setuptools \
            python3-pyelftools swig libssl-dev libelf-dev libgnutls28-dev uuid-dev libncurses-dev \
            device-tree-compiler pkg-config cmake ninja-build

      - name: Cache keys
        id: keys
        run: |
          id=$(platform/build.sh -o "$OUT" toolchain-id)
          [ ${#id} = 64 ]
          # Its host programs link the runner's C library: one cache per runner image.
          echo "toolchain=toolchain-$ImageOS-$id" >> "$GITHUB_OUTPUT"
          echo "downloads=downloads-${{ hashFiles('platform/sources.lock', 'firmware/buildroot/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore downloads
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.OUT }}/downloads
          key: ${{ steps.keys.outputs.downloads }}
          restore-keys: downloads-

      - name: Restore toolchain
        id: toolchain
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.OUT }}/buildroot-output
          key: ${{ steps.keys.outputs.toolchain }}

      - name: Fetch
        run: platform/build.sh -o "$OUT" fetch

      - name: Toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          platform/build.sh -o "$OUT" toolchain
          # Later steps use host/, target/ and the license texts only.
          rm -rf "$OUT/buildroot-output/build" "$OUT/buildroot"
          du -sh "$OUT/buildroot-output"
          df -h /

      # Saved as soon as they exist, so a later failure does not lose them.
      - name: Save toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.OUT }}/buildroot-output
          key: ${{ steps.keys.outputs.toolchain }}

      - name: Save downloads
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.OUT }}/downloads
          key: ${{ steps.keys.outputs.downloads }}

      - name: Build
        env:
          # No Git record of the patched trees: it serves local patch work only.
          NANOKVM_PATCH_GIT: '0'
        run: |
          platform/build.sh -o "$OUT" kernel modules uboot opensbi fip initramfs boot native system server
          # The Go build cache (about 1 GB) is not reused within a run.
          rm -rf "$OUT/server/gocache"
          platform/build.sh -o "$OUT" web tools firmware
          du -sh "$OUT" "$OUT"/* 2>/dev/null | sort -h | tail -8
          df -h /

      - name: Check against expected.sha256
        run: platform/build.sh -o "$OUT" verify

      # On a mismatch, the hashes of every output, to compare with the pins.
      - name: Hashes of the outputs
        if: always()
        run: |
          cd "$OUT/images" 2>/dev/null || exit 0
          find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sed 's|  \./|  |' > "$RUNNER_TEMP/outputs.sha256"
          diff <(grep -v '^#' "$GITHUB_WORKSPACE/platform/expected.sha256" | grep . | LC_ALL=C sort -k2) \
               <(LC_ALL=C sort -k2 "$RUNNER_TEMP/outputs.sha256") > "$RUNNER_TEMP/pins.diff" || true
          echo "$(grep -c '^<' "$RUNNER_TEMP/pins.diff" || true) pinned hashes differ or are missing"
          head -60 "$RUNNER_TEMP/pins.diff"

      - name: Upload hashes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outputs-sha256
          path: |
            ${{ runner.temp }}/outputs.sha256
            ${{ runner.temp }}/pins.diff
          if-no-files-found: ignore
          retention-days: 14
