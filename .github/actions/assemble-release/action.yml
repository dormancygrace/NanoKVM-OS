name: Assemble a release
description: >
  The packages, root file system and SD image from the outputs of a release
  build (the release-build artifact), and the release assets with their
  SHA256SUMS in OUTPUT/assets/public and OUTPUT/assets/packages. Only changed
  packages are uploaded; the others stay in the release that first carried them.
inputs:
  out:
    description: platform/build.sh OUTPUT, prepared by the prepare-build action
    required: true
  keys:
    description: 'platform/build.sh key options: -e ECKEY, or -d for a local EC test key'
    required: true
  image:
    description: attach the SD image (it is always built, as a check that the packages install)
    default: 'true'
runs:
  using: composite
  steps:
    # The packages, rootfs and image steps run as root of a user namespace
    # with subordinate IDs (platform/README.md). Ubuntu lets AppArmor deny
    # unprivileged user namespaces by default.
    - name: User namespaces
      shell: bash
      run: |
        user=$(id -un)
        for file in /etc/subuid /etc/subgid; do
          grep -q "^$user:" "$file" 2>/dev/null || echo "$user:100000:65536" | sudo tee -a "$file"
        done
        ! sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1 ||
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Download the build
      uses: actions/download-artifact@v8
      with:
        name: release-build
        path: ${{ runner.temp }}

    - name: Packages, root file system and image
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        KEYS: ${{ inputs.keys }}
      run: |
        tar -C "$OUT" -xf "$RUNNER_TEMP/release-build.tar"
        # The key options are words: -k FILE -e FILE, or -d.
        # shellcheck disable=SC2086
        platform/build.sh -o "$OUT" $KEYS payloads packages rootfs image

    - name: Assets
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        IMAGE: ${{ inputs.image }}
      run: |
        a=$OUT/assets
        rm -rf "$a"
        mkdir -p "$a"
        repo=$OUT/release/apk/recipes/riscv64
        python3 -c 'import json, sys
        for p in json.load(open(sys.argv[1]))["packages"].values():
            p["changed"] and print(p["apk"])' "$repo/packages.json" |
          while read -r apk; do cp "$repo/$apk" "$a/"; done
        cp "$repo/APKINDEX.tar.gz" "$repo/Packages.adb" "$repo/packages.json" "$a/"
        cp "$repo/addons.json" "$a/"
        [ "$IMAGE" != true ] || cp "$OUT"/release/image/*.img.zip "$OUT/release/image/build-manifest.json" "$a/"
        cp "$OUT/release/installed-packages.txt" "$OUT/release/installed-licenses.txt" "$a/"
        cp "$OUT"/NanoKVM-OS-*-source.tar.xz "$a/"
        python3 scripts/release_assets.py "$a"
        ls -la "$a/public" "$a/packages"
        cat "$a/public/SHA256SUMS" "$a/packages/SHA256SUMS"
