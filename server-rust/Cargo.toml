[package]
name = "nanokvm-server"
version = "3.0.0-experimental.1"
edition = "2021"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "NanoKVM-Server"
path = "src/main.rs"

[dependencies]
aes = "0.9"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.23"
bcrypt = "0.19"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
ctutils = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hmac = "0.13"
ipnet = "2"
libc = "0.2"
md-5 = "0.11"
mediatype = "0.23"
percent-encoding = "2"
getrandom = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_urlencoded = "0.7"
serde-saphyr = "1.3"
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "sync", "time", "process", "io-util"] }
tokio-tungstenite = { version = "0.29", default-features = false }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "debuginfo"
