name: 🐛 Bug report
description: Report something that is not working in NanoKVM OS.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |-
        Thanks for reporting a problem! Please search [existing issues](https://github.com/dormancygrace/NanoKVM-OS/issues?q=is%3Aissue) first.

        For security problems, [report a vulnerability privately](https://github.com/dormancygrace/NanoKVM-OS/security/advisories/new).

        Remove passwords, API tokens, private keys, personal addresses and private screen contents from anything you attach.
  - type: input
    id: version
    attributes:
      label: Application version
      description: Copy the Applications version from Settings → About. If the device cannot boot, enter the release you installed or “unknown”.
      placeholder: e.g. v3.4.0
    validations:
      required: true
  - type: dropdown
    id: board
    attributes:
      label: Device
      options:
        - Sipeed NanoKVM Cube
        - Sipeed NanoKVM Lite
        - Sipeed NanoKVM PCIe
        - Other / not sure
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: Installed image version
      description: Copy the Installed image version from Settings → About, if available. It can differ from the application version.
      placeholder: e.g. v1.6, or unknown
  - type: dropdown
    id: channel
    attributes:
      label: Update channel
      options:
        - Stable
        - Beta
        - Custom build / not sure
  - type: textarea
    id: steps
    attributes:
      label: What happened, and how can it be reproduced?
      description: Include what you expected, what actually happened, and whether the problem is repeatable.
      placeholder: |-
        Steps to reproduce:
        1. ...

        Expected behavior:
        ...

        Actual behavior:
        ...
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Relevant setup
      description: Browser and OS; Wi-Fi or Ethernet; for video issues, include codec, Direct/WebRTC/MJPEG, resolution, FPS and HDMI source. Mention board revision or receiver chip if known.
  - type: input
    id: regression
    attributes:
      label: Did this work before?
      description: If known, give the last working version and anything that changed before the problem appeared.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: 'Optional: copy relevant lines from Settings → System → Diagnostics → Logs. Review them for secrets before posting.'
      render: text
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or additional context
      description: 'Optional: attach screenshots or short recordings here after checking them for private content.'
