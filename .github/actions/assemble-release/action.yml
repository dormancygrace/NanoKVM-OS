name: Assemble a release
description: >
  The APK repository of a release build (the release-build artifact, built
  with platform/build.sh -u) signed with the release key, and the release
  assets with their SHA256SUMS in OUTPUT/assets/public and
  OUTPUT/assets/packages. Only changed packages are uploaded; the others stay
  in the release that first carried them.
inputs:
  out:
    description: an empty directory for the release outputs
    required: true
  keys:
    description: 'scripts/sign-release.sh key options: -e ECKEY, or -d for a local EC test key'
    required: true
  image:
    description: attach the SD image (it is always built, as a check that the packages install)
    default: 'true'
runs:
  using: composite
  steps:
    - name: Download the build
      uses: actions/download-artifact@v8
      with:
        name: release-build
        path: ${{ runner.temp }}

    # The release outputs of the build job and the source archive only,
    # checked before anything is written: that job ran third-party build code.
    # Then the repository gets the release signature (scripts/sign-release.sh).
    # Nothing here runs a build tool or anything restored from a cache.
    - name: Sign the repository
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        KEYS: ${{ inputs.keys }}
      run: |
        python3 scripts/release_build_tar.py "$RUNNER_TEMP/release-build.tar" "$OUT"
        # The key options are words: -e FILE, or -d.
        # shellcheck disable=SC2086
        scripts/sign-release.sh -o "$OUT" $KEYS

    - name: Assets
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        IMAGE: ${{ inputs.image }}
      run: |
        a=$OUT/assets
        rm -rf "$a"
        mkdir -p "$a"
        repo=$OUT/release/apk/recipes/riscv64
        python3 -c 'import json, sys
        for p in json.load(open(sys.argv[1]))["packages"].values():
            p["changed"] and print(p["apk"])' "$repo/packages.json" |
          while read -r apk; do cp "$repo/$apk" "$a/"; done
        cp "$repo/APKINDEX.tar.gz" "$repo/Packages.adb" "$repo/packages.json" "$a/"
        cp "$repo/addons.json" "$a/"
        [ "$IMAGE" != true ] || cp "$OUT"/release/image/*.img.zip "$OUT/release/image/build-manifest.json" "$a/"
        cp "$OUT/release/installed-packages.txt" "$OUT/release/installed-licenses.txt" "$a/"
        cp "$OUT"/NanoKVM-OS-*-source.tar.xz "$a/"
        python3 scripts/release_assets.py "$a"
        ls -la "$a/public" "$a/packages"
        cat "$a/public/SHA256SUMS" "$a/packages/SHA256SUMS"
