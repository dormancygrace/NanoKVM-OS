# The qualified C906 build for the native Alpine recipe, passed with
# `cargo --config`, so it applies to whichever source archive the recipe
# pins: the same settings as addons/rustdesk/Cargo.toml [profile.release]
# and addons/rustdesk/.cargo/config.toml. Keep the three equal.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[target.riscv64-alpine-linux-musl]
rustflags = ["-C", "target-feature=+crt-static,+xtheadba,+xtheadbb,+xtheadbs,+xtheadcmo,+xtheadcondmov,+xtheadfmemidx,+xtheadmac,+xtheadmemidx,+xtheadmempair,+xtheadsync"]
