name: APK repository

# Serves the NanoKVM OS APK repository on GitHub Pages. It is assembled from
# published OS and independent add-on releases. The v3 index is regenerated
# and signed in the protected release environment; the OS version and legacy
# index are unchanged by add-on updates. PRs use test keys and never deploy.
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/apk-repository.yml
      - scripts/assemble-apk-repo.py
      - scripts/release_assets.py
      - scripts/addon_packages.py
      - scripts/index-apk-repo.py
      - scripts/check-ec-key.sh
      - scripts/alpine-signer.sh
      - tests/test-index-apk-repo.py
      - firmware/alpine/addons.json
      - tests/test-assemble-apk-repo.py

permissions:
  contents: read

# One deployment at a time; a newer release waits instead of being cancelled.
concurrency:
  group: apk-repository-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'release' && github.run_id || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dispatch:
    name: Schedule repository update on main
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      # Release events run on a tag; github-pages permits deployment from main.
      # Use the current assembler and the same branch as explicit publication.
      - name: Dispatch Pages assembly
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run apk-repository.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"

  assemble:
    name: Assemble and check
    if: github.event_name != 'release'
    runs-on: ubuntu-26.04
    steps:
      - name: Validate publication branch
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main

      - uses: actions/checkout@v7

      - name: Assemble
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/assemble-apk-repo.py --output site

      # As a device sees it: published keys verify current or historical indexes,
      # core packages carry trusted signatures; pinned add-ons are authenticated
      # through the signed index, and apk reads/fetches them as a device does.
      - name: Check with apk
        run: |
          branch=$(ls site/alpine)
          docker run --rm -v "$PWD/site:/site" -v "$PWD/firmware/alpine/keys:/keys:ro" -v "$PWD/scripts:/scripts:ro" -e "branch=$branch" \
            alpine:3.24 sh -euc '
              apk add --no-cache python3 openssl > /dev/null
              for repo in /site/alpine/$branch/riscv64 /site/beta/alpine/$branch/riscv64; do
                apk --keys-dir /keys verify "$repo/Packages.adb"
                python3 /scripts/index-apk-repo.py --repo "$repo" --keys /keys
                # Only a disposable test key is available in the assembly job.
                testkeys=$(mktemp -d)
                openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$testkeys/test.key"
                openssl pkey -in "$testkeys/test.key" -pubout -out "$testkeys/test.pub"
                apk --allow-untrusted --sign-key "$testkeys/test.key" adbsign --reset-signatures "$repo/Packages.pending.adb"
                apk --keys-dir "$testkeys" verify "$repo/Packages.pending.adb"
                root=$(mktemp -d)
                mkdir -p "$root/etc/apk/keys"
                cp /keys/*.pub "$testkeys/test.pub" "$root/etc/apk/keys/"
                echo "$repo/Packages.pending.adb" > "$root/etc/apk/repositories"
                apk --root "$root" --arch riscv64 add --initdb --no-scripts
                apk --root "$root" --arch riscv64 update
                apk --root "$root" --arch riscv64 search -e nanokvm-release | grep "^nanokvm-release-"
                # On a line of its own: a failure inside a for list would not stop the check.
                addons=$(cd /scripts && python3 -c "import addon_packages; print(*addon_packages.ADDONS)")
                for addon in $addons; do
                  if apk --root "$root" --arch riscv64 search -e "$addon" | grep -q "^$addon-"; then
                    apk --root "$root" --arch riscv64 fetch --stdout "$addon" > /dev/null
                  fi
                done
              done'

      - uses: actions/upload-artifact@v7
        with:
          name: apk-repository-candidate
          path: site
          include-hidden-files: true
          retention-days: 1

  sign:
    name: Sign repository index
    if: github.event_name != 'pull_request'
    needs: assemble
    runs-on: ubuntu-26.04
    environment: release
    steps:
      # The key is in this job: no token in .git/config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: apk-repository-candidate
          path: site
      - name: Sign and verify the index
        env:
          EC_KEY: ${{ secrets.APK_EC_KEY }}
        run: |
          set -euo pipefail
          [ -n "$EC_KEY" ]
          k=$RUNNER_TEMP/index-keys
          install -d -m 0700 "$k"
          trap 'rm -rf "$k"' EXIT
          (umask 077
           printf '%s\n' "$EC_KEY" > "$k/release.key")
          cp firmware/alpine/keys/nkos-release-ec-b8e89b66.pub "$k/"
          scripts/check-ec-key.sh "$k/release.key" "$k/nkos-release-ec-b8e89b66.pub"
          branch=$(ls site/alpine)
          # apk from the minirootfs pinned in platform/sources.lock, not a
          # Docker image: the key goes into it.
          s=$RUNNER_TEMP/signer
          trap 'rm -rf "$k"; sudo rm -rf --one-file-system "$s"' EXIT
          scripts/alpine-signer.sh "$s"
          sudo install -d -m 0700 "$s/signing"
          sudo install -m 0600 "$k/release.key" "$s/signing/"
          sudo install -m 0644 "$k/nkos-release-ec-b8e89b66.pub" "$s/signing/"
          for repo in site/alpine/$branch/riscv64 site/beta/alpine/$branch/riscv64; do
            sudo install -m 0644 "$repo/Packages.pending.adb" "$s/Packages.adb"
            sudo chroot "$s" /sbin/apk --allow-untrusted --sign-key /signing/release.key \
              adbsign --reset-signatures /Packages.adb
            sudo chroot "$s" /sbin/apk --keys-dir /signing verify /Packages.adb
            sudo cat "$s/Packages.adb" > "$repo/Packages.adb"
            rm "$repo/Packages.pending.adb"
          done
      - name: Remove signing keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/index-keys"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: sign
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
