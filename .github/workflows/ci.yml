name: CI

# Hardware-independent checks only: the real server build links the native
# SG2002 libraries, so Go is built and tested with the teststub tag.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Go server
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Releases use a patched go1.27.3 (firmware/cpu/sysmon-runtime).
          go-version: '1.27.x'
          cache-dependency-path: server/go.sum
      # internal/decompress links zlib and liblzma through cgo; the device
      # build uses zlib-ng and liblzma from platform/build.sh.
      - name: Compression headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev liblzma-dev xz-utils
      - name: Build
        run: go build -tags teststub,nomsgpack ./...
      - name: Video recovery native-call guard
        run: python3 ../tests/test-video-recovery-native.py
      - name: Vet
        run: go vet -tags teststub,nomsgpack $(go list -tags teststub,nomsgpack ./... | grep -v /third_party/)
      - name: Test
        run: go test -tags teststub,nomsgpack -count=1 $(go list -tags teststub,nomsgpack ./... | grep -v /third_party/)
      - name: Signed and encrypted SMB media
        run: bash ../tests/test-remote-smb.sh

      - name: C906 WebSocket staging and fallback tests
        env:
          # Gorilla 1.5.3's prepared-message tests intentionally reseed math/rand.
          GODEBUG: randseednop=0
        run: |
          python3 ../tests/test-websocket-c906.py
          out="$RUNNER_TEMP/websocket-c906"
          python3 ../firmware/cpu/go-websocket-c906/prepare.py --go "$(command -v go)" --output "$out" --tests
          python3 ../tests/check-websocket-reproducibility.py --go "$(command -v go)" --output "$RUNNER_TEMP/websocket-repro"
          cd "$out/server"
          go test github.com/gorilla/websocket
          go test -tags=purego github.com/gorilla/websocket
          GOOS=linux GOARCH=riscv64 GORISCV64=rva20u64 CGO_ENABLED=0 \
            go test -c -o "$out/websocket.test" github.com/gorilla/websocket

  poly1305:
    name: Prepared RISC-V Poly1305
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: server/go.sum
      - name: Install scalar RISC-V emulator
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Build and test the production assembly and pinned reference
        run: |
          XCRYPTO=$(go mod download -json golang.org/x/crypto@v0.57.0 | jq -r .Dir)
          python3 tests/test-c906-poly1305.py --base "$(go env GOROOT)" \
            --xcrypto "$XCRYPTO" --output "$RUNNER_TEMP/poly1305"

  web:
    name: Web UI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Type-check and build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Test
        run: node --import tsx --test tests/*.test.mjs

  scripts:
    name: Init scripts and tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system test tools
        run: sudo apt-get update && sudo apt-get install -y dosfstools mtools iproute2 g++ busybox openssh-client libssl-dev liblz4-dev
      - name: Shellcheck (errors only; parses each script per its shebang)
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in server/third_party/*|*.patch) continue ;; esac
            [ -f "$f" ] || continue
            if head -n1 "$f" | grep -qE '^#!.*(/|env )(ba|da)?sh( |$)'; then
              printf '%s\0' "$f"
            fi
          done > "$RUNNER_TEMP/shell-scripts"
          xargs -0 shellcheck -S error < "$RUNNER_TEMP/shell-scripts"
      - name: Native stream geometry and codec policy
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isupport/sg2002/additional/kvm/include \
            support/sg2002/additional/kvm/tests/stream_size_test.cpp -o "$RUNNER_TEMP/stream-size-test"
          "$RUNNER_TEMP/stream-size-test"
      - name: Python syntax
        run: git ls-files -z '*.py' | xargs -0 python3 -m py_compile
      - name: HDMI GPIO event fault injection
        run: |
          python3 tests/test-hdmi-events.py
          NANOKVM_SANITIZE=1 python3 tests/test-hdmi-events.py
      # Check C906 .4byte/WORD encodings against GNU as/objdump for XTheadVector.
      # The GHASH generator also runs its output against a bit-serial GHASH.
      - name: Generated C906 assembly is up to date
        run: |
          sudo apt-get install -y binutils-riscv64-linux-gnu
          cd firmware/cpu/go-crypto-c906
          python3 gen_chacha_riscv64.py --binutils riscv64-linux-gnu- --check chacha_riscv64.s
          python3 ../go-websocket-c906/gen_mask_riscv64.py --binutils riscv64-linux-gnu- --check ../go-websocket-c906/mask_linux_riscv64.s
          python3 gen_sha1mb_riscv64.py --binutils riscv64-linux-gnu- --check ../../../server/internal/sha1mb/sha1mb_riscv64.s
          python3 gen_chacha_linux.py --binutils riscv64-linux-gnu- --check ../../../platform/kernel/0040-crypto-riscv-xtheadvector-chacha.patch
          python3 gen_ghash_linux.py --binutils riscv64-linux-gnu- --check ../../../platform/kernel/0041-crypto-riscv-c906-ghash.patch
          python3 ../../crypto/openssl-c906/generate-ghash.py --binutils riscv64-linux-gnu- --check
          python3 ../../../tests/manual/c906-log-rvv/check-encodings.py --prefix riscv64-linux-gnu-
          curl -fsSL "$(python3 gen_keccak_c906.py --print-url)" -o "$RUNNER_TEMP/keccak1600-riscv.pl"
          python3 gen_keccak_c906.py --cryptogams "$RUNNER_TEMP/keccak1600-riscv.pl" --binutils riscv64-linux-gnu- --check keccak_c906_riscv64.s
      - name: Log XTheadVector instruction encodings
        run: python3 tests/manual/c906-log-rvv/check-encodings.py --prefix riscv64-linux-gnu-
      - name: OpenSSL C906 ChaCha dispatch
        run: |
          sudo apt-get install -y libssl-dev
          python3 firmware/crypto/openssl-c906/generate-chacha.py --binutils riscv64-linux-gnu- --check
          python3 firmware/crypto/experimental/openssl-chacha20/test-dispatch.py --negative-control
      - name: OpenSSL GHASH runtime dispatch
        run: python3 firmware/crypto/experimental/openssl-ghash/test-dispatch.py --negative-control
      - name: OpenSSL direct-DMA transport failure paths
        run: python3 firmware/crypto/experimental/openssl-sg2002/test-transport.py --negative-control
      - name: OpenSSL SHA-256 partial DMA continuation
        run: |
          python3 firmware/crypto/openssl-c906/generate-sha256.py --check
          python3 firmware/crypto/experimental/openssl-sha256/test-fallback.py --negative-control
      - name: OpenSSL pinned patches and C906 SHA-256/GHASH arithmetic
        run: |
          sudo apt-get install -y gcc-riscv64-linux-gnu qemu-user
          python3 tests/test-openssl-source.py --negative-control
      - name: OpenSSL AES partial DMA continuation
        run: python3 firmware/crypto/experimental/openssl-aes/test-blocks.py
      - name: OpenSSL AES EVP state and counter carry
        run: |
          cc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined firmware/crypto/experimental/openssl-aes/verify.c -lcrypto -o /tmp/openssl-aes-verify
          /tmp/openssl-aes-verify
          cc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined firmware/crypto/experimental/openssl-aes/verify-gcm.c -lcrypto -o /tmp/openssl-gcm-verify
          /tmp/openssl-gcm-verify
          cc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Iplatform/modules/sg2002-aes firmware/crypto/experimental/openssl-aes/verify-ctr.c -lcrypto -o /tmp/openssl-ctr-verify
          /tmp/openssl-ctr-verify
          cc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined firmware/crypto/experimental/openssl-aes/verify-tails.c -lcrypto -o /tmp/openssl-aes-tails
          /tmp/openssl-aes-tails bfe84c43ff49df11
      - name: Independent add-on repository index
        run: python3 tests/test-index-apk-repo.py
      - name: ECDSA package signing and upgrade
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src alpine:3.24 sh -ec '
            apk add --no-cache alpine-sdk alpine-keys python3 openssl coreutils > /dev/null
            python3 tests/test-ecdsa-packages.py
            python3 tests/test-openssl-package.py'

      - name: RustDesk package version transitions
        run: python3 tests/test-rustdesk-builder.py
      - name: Compiler cache cold/warm correctness
        run: |
          sudo apt-get install -y ccache
          python3 tests/test-compiler-cache.py
      - name: Kernel LZ4 compressor compatibility
        run: |
          python3 tests/test-lz4-compressor.py
          NANOKVM_SANITIZE=1 python3 tests/test-lz4-compressor.py
          python3 tests/test-lz4-small-table.py
          NANOKVM_SANITIZE=1 python3 tests/test-lz4-small-table.py
      - name: Platform Buildroot configuration
        run: python3 tests/test-platform-config.py
      - name: Alpine DHCP gateway integration
        # Only the disposable network namespace is changed; Ubuntu restricts
        # unprivileged user namespaces, so let the test create it as root.
        run: sudo python3 tests/test-dhcp-gateway.py
      - name: IPv6 policy and interface restart tests
        run: sudo python3 tests/test-ipv6-policy.py
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: server/go.sum
      - name: RISC-V log sanitizer ABI and test build
        working-directory: server
        env:
          GOOS: linux
          GOARCH: riscv64
          GORISCV64: rva20u64
          CGO_ENABLED: '0'
        run: |
          go vet ./logs ./logger
          go test -c -o "$RUNNER_TEMP/logs-riscv64.test" ./logs
      - name: Gateway preference against kernel routes
        # A disposable network namespace, as for the DHCP gateway test above.
        working-directory: server
        run: |
          go test -tags teststub,nomsgpack -c -o "$RUNNER_TEMP/network.test" ./service/network
          sudo unshare -n env NANOKVM_NETNS_TEST=1 "$RUNNER_TEMP/network.test" -test.run InANetworkNamespace -test.v
      - name: Export production rollback commands
        working-directory: server
        run: NKOS_ROLLBACK_COMMANDS="$RUNNER_TEMP/rollback-commands.json" go test ./internal/apkrollback -run TestExportIntegrationCommands -count=1
      - name: APK application split migration
        run: |
          docker run --rm --volume "$PWD:/src:ro" --volume "$RUNNER_TEMP/rollback-commands.json:/rollback-commands.json:ro" --workdir /src alpine:3.24 sh -ec '
            apk add --no-cache python3 openssl
            python3 tests/test-split-app-packages.py --apk /sbin/apk
            python3 tests/test-settings-recovery-apk.py --apk /sbin/apk
            python3 tests/test-release-channels-apk.py --apk /sbin/apk --commands /rollback-commands.json
          '
      - name: Script tests
        run: |
          set -e
          for t in cpu-profile aic-firmware-path alpine-kernel-activation alpine-bootloader-activation alpine-sd-image-boot alpine-network alpine-app-wait \
                   alpine-recovery-password alpine-recovery-settings alpine-firstboot-storage-errors alpine-check-volume alpine-service-deps board-selection usb-state capture-restart \
                   s15-packaging kvm-system-lifecycle kvm-file-inputs hdmi-detection-cache hdmi-receiver-start lt6911-probe hdmi-sessions \
                   mmf-light-link native-bundle-abi capture-colour-switch capture-output-snapshot monitor-edids edid-rgb-range video-pool-native nanokvm-service-stop net-probe server-supervisor oled-detect oled-ip-window wifi-ap-key platform-build kernel-panic-policy compare-outputs release-build release-build-tar apk-resign release-workflow release-storage next-release next-addon-revision addon-packages build-addon assemble-apk-repo package-versions \
                   portrait-edid wide-monitor-edids serial-console-disk startup-aes-policy wifi-selector upstream-watch kernel-update-pr upstream-update-prs \
                   app-trigger keys-repository resource-trim rustdesk-c906-config stock-profile dhcp-options dhcpv6-stop s95-start-prelude ssh-rescue cache-cleanup tpu-lifetime trng usb-flags-migrate usb-layout-start memory-reclaim; do
            echo "::group::tests/test-$t.py"; python3 "tests/test-$t.py"; echo "::endgroup::"
          done
          python3 tests/test-udev-coldplug-default.py
          python3 tests/test-settings-recovery-boot.py
          for t in firmware/services/test_serial_bridge.py firmware/services/test_serial_console.py; do
            echo "::group::$t"; python3 "$t"; echo "::endgroup::"
          done
          python3 tests/test-usb-prefix.py \
            --script firmware/alpine/compat/S30usbnet
          for t in tests/test-*.sh; do
            # Needs root for its network namespace; run it by hand (tests/README.md).
            [ "$t" = tests/test-pmtu-netns.sh ] && continue
            # The Bash SMB fixture runs in the Go server job with Docker/sudo.
            [ "$t" = tests/test-remote-smb.sh ] && continue
            echo "::group::$t"; sh "$t"; echo "::endgroup::"
          done

  additional-go-modules:
    name: Additional Go modules (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        directory:
          - addons/ipmi
          - server/third_party/pion-dtls
          - server/third_party/pion-ice
          - server/third_party/pion-srtp
          - firmware/crypto/experimental/sg2002-crypto-all/ghash-go
          - tests/manual/c906-poly1305/wireguard
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: '**/go.sum'
      - run: go build ./...
      - name: Test
        run: go test -timeout 5m ./...
      - name: Vet IPMI add-on
        if: matrix.directory == 'addons/ipmi'
        run: go vet ./...
      - name: Race-test IPMI add-on
        if: matrix.directory == 'addons/ipmi'
        run: go test -race -timeout 5m ./...
      - name: Cross-build WireGuard measurement endpoints
        if: matrix.directory == 'tests/manual/c906-poly1305/wireguard'
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o "$RUNNER_TEMP/wg-client.exe" client_windows.go
          CGO_ENABLED=0 GOOS=linux GOARCH=riscv64 go build -o "$RUNNER_TEMP/wg-server" server_linux.go

  rustdesk:
    name: RustDesk host tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: addons/rustdesk
    steps:
      - uses: actions/checkout@v7
      - name: Select pinned Rust toolchain
        # rustup reads addons/rustdesk/rust-toolchain.toml, including the target.
        run: |
          rustc --version
          cargo --version
      - name: Test locked Rust dependencies
        run: cargo test --locked
      # The device build (scripts/build-rustdesk-addon.py) cross-compiles for
      # this target; check compiles it without the cross linker. All features
      # include the c906-crypto-perf probe binary, which the tests skip.
      - name: Check the device target and the probe binary
        run: cargo check --locked --target riscv64gc-unknown-linux-musl --all-features --bins
      - name: Check the declared minimum Rust version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --locked --all-features --bins
