name: Prepare a platform build
description: >
  Host packages, the pinned downloads and the cached Buildroot toolchain in
  OUTPUT, as platform/build.sh needs them. Caches saved by builds of main serve
  every other ref.
inputs:
  out:
    description: platform/build.sh OUTPUT (a fixed absolute path; the toolchain is not relocatable)
    required: true
  save-caches:
    description: save a newly built toolchain and new downloads
    default: 'false'
outputs:
  ccache-key:
    description: Unique immutable compiler cache snapshot key
    value: ${{ steps.keys.outputs.ccache-key }}
runs:
  using: composite
  steps:
    # A toolchain build needs about 25 GB. GitHub guarantees only 14 GB, but
    # the runners had 86 GB free (2026-10-16); the cleanup, 3.5 minutes of
    # removing preinstalled SDKs and the tool cache (no setup-* action can
    # run after it), runs only when space is short.
    - name: Disk space
      shell: bash
      run: |
        df -h /
        [ "$(df --output=avail -k / | tail -1)" -lt $((30 * 1024 * 1024)) ] || exit 0
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
        sudo docker image prune -af > /dev/null 2>&1 || true
        df -h /

    # Buildroot's requirements, the kernel and U-Boot host tools, and uidmap
    # for the steps that run in a user namespace.
    - name: Host packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential bc bison flex cpio rsync unzip \
          file patch perl gawk wget curl git xz-utils zstd python3 python3-dev python3-setuptools \
          python3-pyelftools swig libssl-dev libelf-dev libgnutls28-dev uuid-dev libncurses-dev \
          device-tree-compiler pkg-config cmake ninja-build uidmap

    - name: Cache keys
      id: keys
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        source platform/compiler-cache.sh
        configure_compiler_cache "$OUT"
        for name in BR2_USE_CCACHE BR_CACHE_DIR CCACHE_DIR CCACHE_MAXSIZE; do
          printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
        done
        id=$(platform/build.sh -o "$OUT" toolchain-id)
        [ ${#id} = 64 ]
        echo "CCACHE_NAMESPACE=nkos-$id" >> "$GITHUB_ENV"
        # Its host programs link the runner's C library: one cache per runner image.
        echo "toolchain=toolchain-$ImageOS-$id" >> "$GITHUB_OUTPUT"
        echo "ccache-prefix=ccache-v1-$ImageOS-$id-" >> "$GITHUB_OUTPUT"
        echo "ccache-key=ccache-v1-$ImageOS-$id-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
        echo "downloads=downloads-${{ hashFiles('platform/sources.lock', 'firmware/buildroot/**') }}" >> "$GITHUB_OUTPUT"

    - name: Restore downloads
      id: downloads
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.out }}/downloads
        key: ${{ steps.keys.outputs.downloads }}
        restore-keys: downloads-

    # Kept outside the toolchain archive: object entries grow during later
    # kernel/native builds. Only main jobs save shared snapshots at job end.
    - name: Restore compiler cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.out }}/ccache
        key: ${{ steps.keys.outputs.ccache-key }}
        restore-keys: ${{ steps.keys.outputs.ccache-prefix }}

    - name: Restore toolchain
      id: toolchain
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.out }}/buildroot-output
        key: ${{ steps.keys.outputs.toolchain }}

    - name: Fetch
      shell: bash
      run: platform/build.sh -o "${{ inputs.out }}" fetch

    - name: Toolchain
      if: steps.toolchain.outputs.cache-hit != 'true'
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        platform/build.sh -o "$OUT" toolchain
        # Later steps use host/, target/ and the license texts only.
        rm -rf "$OUT/buildroot-output/build" "$OUT/buildroot"
        du -sh "$OUT/buildroot-output"
        df -h /

    - name: Check compiler cache
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: python3 tests/test-compiler-cache.py --toolchain "$OUT/buildroot-output/host"

    # Saved as soon as they exist, so a later failure does not lose them.
    - name: Save toolchain
      if: inputs.save-caches == 'true' && steps.toolchain.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.out }}/buildroot-output
        key: ${{ steps.keys.outputs.toolchain }}

    - name: Save downloads
      if: inputs.save-caches == 'true' && steps.downloads.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.out }}/downloads
        key: ${{ steps.keys.outputs.downloads }}
