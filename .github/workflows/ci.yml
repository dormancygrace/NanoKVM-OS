name: CI

# Hardware-independent checks only: the real server build links the native
# SG2002 libraries, so Go is built and tested with the teststub tag.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What a pull request touches, so the jobs it cannot affect are skipped
  # (none is a required check). A change under .github and a push to main run
  # everything; the patterns include the files outside each job's directory
  # that its tests read.
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.areas.outputs.server }}
      poly1305: ${{ steps.areas.outputs.poly1305 }}
      web: ${{ steps.areas.outputs.web }}
      rustdesk: ${{ steps.areas.outputs.rustdesk }}
      modules: ${{ steps.areas.outputs.modules }}
    steps:
      - id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$RUNNER_TEMP/changed-files
          if [ -n "$PR" ]; then
            # A rename changes both the old and the new area.
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$files"
            # The API lists at most 3000 files: test everything beyond that.
            [ "$(wc -l < "$files")" -lt 3000 ] || echo .github/ > "$files"
          else
            echo .github/ > "$files"
          fi
          all='^\.github/'
          changed() { grep -qE "$all|$1" "$files" && echo true || echo false; }
          modules=()
          # The IPMI add-on builds against the server module.
          [ "$(changed '^addons/ipmi/|^server/')" = true ] && modules+=(addons/ipmi)
          {
            echo "server=$(changed '^(server|support|firmware/cpu)/|^addons/[^/]+/addon-ui\.json$')"
            echo "poly1305=$(changed '^server/go\.(mod|sum)$|^firmware/cpu/(go-crypto-c906|sysmon-runtime|go-bytes-index)/|^tests/test-c906-poly1305\.py$')"
            echo "web=$(changed '^web/|^\.nvmrc$')"
            echo "rustdesk=$(changed '^addons/rustdesk/')"
            echo "modules=$(printf '%s\n' "${modules[@]}" | jq -Rsc 'split("\n") | map(select(. != ""))')"
          } | tee -a "$GITHUB_OUTPUT"

  test-budget:
    name: Test budget
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/check-test-budget.py "origin/${{ github.base_ref }}" HEAD

  server:
    name: Go server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Releases use a patched go1.27.3 (firmware/cpu/sysmon-runtime).
          go-version: '1.27.x'
          cache-dependency-path: server/go.sum
      # internal/decompress links zlib through cgo; the device build uses
      # zlib-ng from platform/build.sh.
      - name: Compression headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build
        run: go build -tags teststub,nomsgpack ./...
      - name: Vet
        run: go vet -tags teststub,nomsgpack $(go list -tags teststub,nomsgpack ./... | grep -v /third_party/)
      - name: Test
        run: go test -tags teststub,nomsgpack -count=1 $(go list -tags teststub,nomsgpack ./... | grep -v /third_party/)
      - name: NanoKVM tests of the patched pion modules
        run: |
          for m in pion-dtls pion-ice pion-srtp; do
            (cd third_party/$m && go test -count=1 ./...)
          done
      - name: Prepared C906 WebSocket module builds for the device
        run: |
          out="$RUNNER_TEMP/websocket-c906"
          python3 ../firmware/cpu/go-websocket-c906/prepare.py --go "$(command -v go)" --output "$out"
          cd "$out/server"
          GOOS=linux GOARCH=riscv64 GORISCV64=rva20u64 CGO_ENABLED=0 go vet github.com/gorilla/websocket

  poly1305:
    name: Prepared RISC-V Poly1305
    needs: changes
    if: needs.changes.outputs.poly1305 == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: server/go.sum
      - name: Install scalar RISC-V emulator
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Build and test the production assembly and pinned reference
        run: |
          XCRYPTO=$(go mod download -json golang.org/x/crypto@v0.57.0 | jq -r .Dir)
          python3 tests/test-c906-poly1305.py --base "$(go env GOROOT)" \
            --xcrypto "$XCRYPTO" --output "$RUNNER_TEMP/poly1305"

  web:
    name: Web UI
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Node runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libatomic1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Type-check and build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Test
        run: node --import tsx --test tests/*.test.mjs

  scripts:
    name: Init scripts and tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck (errors only; parses each script per its shebang)
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in server/third_party/*|*.patch) continue ;; esac
            [ -f "$f" ] || continue
            if head -n1 "$f" | grep -qE '^#!.*(/|env )(ba|da)?sh( |$)'; then
              printf '%s\0' "$f"
            fi
          done > "$RUNNER_TEMP/shell-scripts"
          xargs -0 shellcheck -S error < "$RUNNER_TEMP/shell-scripts"
      - name: Python syntax
        run: git ls-files -z '*.py' | xargs -0 python3 -m py_compile
      # Check C906 .4byte/WORD encodings against GNU as/objdump for XTheadVector.
      # The GHASH generator also runs its output against a bit-serial GHASH, the
      # vector Poly1305 generator against a big-integer Poly1305.
      - name: Generated C906 assembly is up to date
        run: |
          sudo apt-get install -y binutils-riscv64-linux-gnu
          cd firmware/cpu/go-crypto-c906
          python3 gen_chacha_riscv64.py --binutils riscv64-linux-gnu- --check chacha_riscv64.s
          python3 ../go-websocket-c906/gen_mask_riscv64.py --binutils riscv64-linux-gnu- --check ../go-websocket-c906/mask_linux_riscv64.s
          python3 gen_sha1mb_riscv64.py --binutils riscv64-linux-gnu- --check ../../../server/internal/sha1mb/sha1mb_riscv64.s
          python3 gen_annexb_riscv64.py --binutils riscv64-linux-gnu- --check ../../../server/internal/annexb/annexb_riscv64.s
          python3 ../sysmon-runtime/gen_memmove_c906.py --binutils riscv64-linux-gnu- --check ../sysmon-runtime/nanokvm_memmove_riscv64.s
          python3 ../sysmon-runtime/gen_memclr_c906.py --binutils riscv64-linux-gnu- --check ../sysmon-runtime/nanokvm_memclr_riscv64.s
          python3 gen_chacha_linux.py --binutils riscv64-linux-gnu- --check ../../../platform/kernel/0040-crypto-riscv-xtheadvector-chacha.patch
          python3 gen_ghash_table.py --selftest 50 --flavor linux --tables 2 --name ghash_blocks_c906 --check ../../../platform/kernel/0041-crypto-riscv-c906-ghash.patch
          python3 gen_ghash_table.py --flavor openssl --tables 2 --name ossl_ghash_blocks_c906 --check ../../crypto/openssl-c906/0010-ghash-c906.patch
          python3 ../../../server/logs/check-encodings.py --prefix riscv64-linux-gnu-
          python3 ../../crypto/openssl-c906/generate-chacha.py --binutils riscv64-linux-gnu- --check
          curl -fsSL "$(python3 ../../crypto/openssl-c906/generate-chacha-scalar.py --print-url)" -o "$RUNNER_TEMP/chacha-riscv.pl"
          python3 ../../crypto/openssl-c906/generate-chacha-scalar.py --cryptogams "$RUNNER_TEMP/chacha-riscv.pl" --check
          python3 gen_sha2_c906.py --selftest 40 --bits 256 --name ossl_sha256_c906_blocks --check ../../crypto/openssl-c906/0003-sha256-dma.patch crypto/sha/sha256-c906.S
          python3 gen_sha2_c906.py --bits 256 --name block --flavor go --binutils riscv64-linux-gnu- --check-file sha256block_riscv64.s
          python3 gen_sha2_c906.py --bits 512 --name block --flavor go --binutils riscv64-linux-gnu- --check-file sha512block_riscv64.s
          python3 gen_sha2_c906.py --bits 512 --name ossl_sha512_c906_blocks --check ../../crypto/openssl-c906/0003-sha256-dma.patch crypto/sha/sha512-c906.S
          python3 gen_sha2_c906.py --bits 256 --name sha256_blocks_c906 --flavor linux --check ../../../platform/kernel/0079-crypto-riscv-c906-sha2.patch lib/crypto/riscv/sha256-riscv64-c906.S
          python3 gen_sha2_c906.py --bits 512 --name sha512_blocks_c906 --flavor linux --check ../../../platform/kernel/0079-crypto-riscv-c906-sha2.patch lib/crypto/riscv/sha512-riscv64-c906.S
          python3 gen_aes_c906.py --selftest 30 --name aes_c906 --flavor linux --check ../../../platform/kernel/0080-crypto-riscv-c906-aes.patch lib/crypto/riscv/aes-riscv64-c906.S
          python3 ../../../scripts/gen-oled-web-font.py --check
          curl -fsSL "$(python3 gen_keccak_c906.py --print-url)" -o "$RUNNER_TEMP/keccak1600-riscv.pl"
          python3 gen_keccak_c906.py --cryptogams "$RUNNER_TEMP/keccak1600-riscv.pl" --binutils riscv64-linux-gnu- --check keccak_c906_riscv64.s
          curl -fsSL "$(python3 gen_poly1305_c906.py --print-url)" -o "$RUNNER_TEMP/poly1305-riscv.pl"
          python3 gen_poly1305_c906.py --cryptogams "$RUNNER_TEMP/poly1305-riscv.pl" --binutils riscv64-linux-gnu- --check sum_c906_riscv64.s
          python3 gen_poly1305_vector.py --binutils riscv64-linux-gnu- --go --check sum_vector_riscv64.s
          python3 gen_poly1305_vector.py --binutils riscv64-linux-gnu- --linux --check ../../../platform/kernel/0077-crypto-riscv-xtheadvector-poly1305.patch
          python3 gen_poly1305_vector.py --binutils riscv64-linux-gnu- --openssl --check ../../crypto/openssl-c906/0012-poly1305-c906.patch
      - name: OpenSSL pinned patches and C906 SHA-256/GHASH arithmetic
        run: |
          # The Azure mirror can stall on the large cross-toolchain packages.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|://azure[.]archive[.]ubuntu[.]com/|://archive.ubuntu.com/|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y gcc-riscv64-linux-gnu qemu-user
          python3 tests/test-openssl-source.py
      - name: Independent add-on repository index
        run: python3 tests/test-index-apk-repo.py
      - name: ECDSA package signing and upgrade
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src alpine:3.24 sh -ec '
            apk add --no-cache alpine-sdk alpine-keys python3 openssl coreutils > /dev/null
            python3 tests/test-ecdsa-packages.py'

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: server/go.sum
      - name: RISC-V log sanitizer and Annex-B search ABI and test build
        working-directory: server
        env:
          GOOS: linux
          GOARCH: riscv64
          GORISCV64: rva20u64
          CGO_ENABLED: '0'
        run: |
          go vet ./logs ./logger
          go test -c -o "$RUNNER_TEMP/logs-riscv64.test" ./logs
          go vet ./internal/annexb ./internal/xtheadvector
          go test -c -o "$RUNNER_TEMP/annexb-riscv64.test" ./internal/annexb
      - name: Script tests
        run: |
          set -e
          for t in tests/test-apk-resign.py tests/test-release-build-tar.py firmware/services/test_serial_bridge.py; do
            echo "::group::$t"; python3 "$t"; echo "::endgroup::"
          done

  # The IPMI add-on, when it or the server changes.
  additional-go-modules:
    name: Additional Go modules (${{ matrix.directory }})
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.changes.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: '**/go.sum'
      - run: go build ./...
      - name: IPMI authentication and protocol tests
        run: go test -timeout 5m ./...
      - name: Vet IPMI add-on
        if: matrix.directory == 'addons/ipmi'
        run: go vet ./...
      - name: Race-test IPMI add-on
        if: matrix.directory == 'addons/ipmi'
        run: go test -race -timeout 5m ./...

  rustdesk:
    name: RustDesk host tests
    needs: changes
    if: needs.changes.outputs.rustdesk == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: addons/rustdesk
    steps:
      - uses: actions/checkout@v7
      - name: Select pinned Rust toolchain
        # rustup reads addons/rustdesk/rust-toolchain.toml, including the target.
        run: |
          rustc --version
          cargo --version
      - name: Test locked Rust dependencies
        run: cargo test --locked
      # The device build (scripts/build-rustdesk-addon.py) cross-compiles for
      # this target; check compiles it without the cross linker.
      - name: Check the device target
        run: cargo check --locked --target riscv64gc-unknown-linux-musl --bins
      - name: Check the declared minimum Rust version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --locked --bins
