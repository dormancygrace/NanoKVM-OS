name: Release build

# Builds every output of platform/build.sh on a GitHub runner and publishes
# their hashes (OUTPUT/images/SHA256SUMS) as the outputs-sha256 artifact. On a
# pull request it also comments with the outputs that differ from the build
# of main the pull request merges into. No signing keys are involved: the
# packages, rootfs and image steps follow with signing in CI.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', '**/README.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md', '**/README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Only PR runs share a group. Main/dispatch runs have separate pending slots,
  # so a newer push cannot discard a main build before it starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and hash the outputs
    # Ubuntu 26.04: the kernel configuration depends on the host OpenSSL
    # (OPENSSL_SUPPORTS_ML_DSA needs 3.5, which 24.04 lacks).
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    permissions:
      contents: read
      # The outputs-sha256 artifact of a main build, and the comment.
      actions: read
      pull-requests: write
    env:
      # A fixed absolute path: the cached toolchain is not relocatable.
      OUT: /home/runner/nanokvm-out
    steps:
      - uses: actions/checkout@v7
        with:
          # The history of main, to find the main build to compare with.
          fetch-depth: 0

      # Builds of main save the caches that every other ref restores.
      - uses: ./.github/actions/prepare-build
        id: prepare
        with:
          out: ${{ env.OUT }}
          save-caches: 'true'

      - name: Build
        env:
          # No Git record of the patched trees: it serves local patch work only.
          NANOKVM_PATCH_GIT: '0'
        run: |
          platform/build.sh -o "$OUT" kernel modules uboot opensbi fip initramfs boot native system tools server
          # The Go build cache (about 1 GB) is not reused within a run.
          rm -rf "$OUT/server/gocache"
          platform/build.sh -o "$OUT" web firmware
          du -sh "$OUT" "$OUT"/* 2>/dev/null | sort -h | tail -8
          df -h /

      - name: Check kernel configuration guard
        run: |
          python3 tests/test-kernel-config.py --source "$OUT/kernel/src" \
            --cross "$OUT/buildroot-output/host/bin/riscv64-buildroot-linux-musl-"

      - name: Check C906 zstd contracts
        run: |
          python3 tests/test-zstd-c906.py --source "$OUT/kernel/src"
          NANOKVM_SANITIZE=1 python3 tests/test-zstd-c906.py --source "$OUT/kernel/src"

      - name: Check zram zstd parameter lifetime
        run: |
          python3 tests/test-zram-zstd.py --source "$OUT/kernel/src"
          NANOKVM_SANITIZE=1 python3 tests/test-zram-zstd.py --source "$OUT/kernel/src"

      - name: Check LZ4 decoder contracts
        run: |
          python3 tests/test-lz4-decompressor.py --source "$OUT/kernel/src"
          NANOKVM_SANITIZE=1 python3 tests/test-lz4-decompressor.py --source "$OUT/kernel/src"

      - name: Check VDI poll deadlines
        run: python3 tests/test-vdi-poll.py --source "$OUT/modules/sources/osdrv/interdrv/cvi_vc_drv/vcodec/vdi/linux/vdi.c"

      - name: Check VI damaged frames and error recovery
        run: python3 tests/test-vi-damaged-frames.py "$OUT/modules/sources/osdrv"

      - name: Check exfat output
        run: python3 tests/test-exfatprogs-output.py --images "$OUT/images"

      - name: Hashes
        run: platform/build.sh -o "$OUT" hashes

      - name: Upload hashes
        uses: actions/upload-artifact@v7
        with:
          name: outputs-sha256
          path: ${{ env.OUT }}/images/SHA256SUMS
          retention-days: 90

      # The merge commit's first parent is the tip of the base branch. The
      # reference is the newest build of a main commit it contains (a commit
      # that changes only documentation is not built).
      - name: Compare with main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          base=$(git rev-parse HEAD^1)
          run='' sha=''
          while read -r id head; do
            if git merge-base --is-ancestor "$head" "$base" 2>/dev/null; then run=$id sha=$head; break; fi
          done < <(gh run list --workflow release-build.yml --branch main --status success --limit 100 \
                     --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"')
          report=$RUNNER_TEMP/outputs.md
          if [ -z "$run" ]; then
            printf '### Build outputs\n\nNo build of main to compare with yet.\n\n' > "$report"
          elif ! gh run download "$run" -n outputs-sha256 -D "$RUNNER_TEMP/main"; then
            # An expired artifact or an API error must not fail a good build.
            printf '### Build outputs\n\nThe hashes of the main build %s could not be downloaded.\n\n' "$run" > "$report"
          else
            label="the build of main at ${sha:0:10}"
            [ "$sha" = "$base" ] || label="$label; $BASE_REF is at ${base:0:10}, so outputs changed since then are listed too"
            python3 scripts/compare-outputs.py "$RUNNER_TEMP/main/SHA256SUMS" "$OUT/images/SHA256SUMS" \
              --markdown --title 'Build outputs' --base "$label" > "$report"
          fi
          printf 'Hashes: `outputs-sha256` artifact of [this run](%s).\n' "$RUN_URL" >> "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, updated by each build. A pull request
      # from a fork has a read-only token and gets the job summary only.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- release-build-outputs -->'
          body="$marker"$'\n'"$(cat "$RUNNER_TEMP/outputs.md")"
          # sed reads to the end, unlike head: no SIGPIPE for gh under pipefail.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                 --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | sed -n 1p)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

      - name: Save compiler cache
        uses: ./.github/actions/save-compiler-cache
        if: always() && steps.prepare.outputs.ccache-key != ''
        with:
          out: ${{ env.OUT }}
          key: ${{ steps.prepare.outputs.ccache-key }}
