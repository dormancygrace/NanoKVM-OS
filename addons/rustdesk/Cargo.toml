[package]
name = "nanokvm-rustdesk"
version = "0.5.3"
edition = "2021"
rust-version = "1.87"
description = "RustDesk HDMI and USB HID endpoint for NanoKVM OS"
license = "AGPL-3.0-only"
publish = false

[features]
performance-probes = []

[[bin]]
name = "nanokvm-rustdesk"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
blake2 = "0.11"
bytes = "1.10"
crypto_box = "0.9"
crypto_secretbox = "0.1"
ed25519-dalek = "3.0"
libc = "0.2"
prost = "0.14"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.44", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }

# The qualified C906 build; the target flags are in .cargo/config.toml.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[[bin]]
name = "c906-crypto-perf"
path = "src/bin/c906-crypto-perf.rs"
required-features = ["performance-probes"]
